<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 1.35 13.15 3.2v4.2c0 3.15-2.15 5.4-5.15 6.8-3-1.4-5.15-3.65-5.15-6.8V3.2Z" />
        <path d="M5.25 8.05 7.1 9.95 10.85 6.05" />
      </svg>
      <p class="brand__name">{{ 'TITLE' | translate }}</p>
    </div>
    <mat-button-toggle-group
      class="lang-toggle"
      name="language"
      [aria-label]="'CHANGE_LANGUAGE' | translate"
      [hideSingleSelectionIndicator]="true"
      [formControl]="langFc"
    >
      <mat-button-toggle value="pl" [attr.aria-label]="'LANGUAGE.PL' | translate">
        PL
      </mat-button-toggle>
      <mat-button-toggle value="en" [attr.aria-label]="'LANGUAGE.EN' | translate">
        EN
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</header>

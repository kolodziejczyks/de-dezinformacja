<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" />
        <path
          class="brand__bar"
          fill-rule="evenodd"
          d="M8.2 6.4h8.4c5.3 0 8.8 3.5 8.8 9.6s-3.5 9.6-8.8 9.6H8.2V6.4zm4 3.8v11.6h4.2c2.8 0 4.5-1.8 4.5-5.8s-1.7-5.8-4.5-5.8h-4.2z"
        />
      </svg>
      <p class="brand__name">{{ 'TITLE' | translate }}</p>
    </div>
    <mat-button-toggle-group
      class="lang-toggle"
      name="language"
      [aria-label]="'CHANGE_LANGUAGE' | translate"
      [hideSingleSelectionIndicator]="true"
      [formControl]="langFc"
    >
      <mat-button-toggle value="pl" [attr.aria-label]="'LANGUAGE.PL' | translate">
        PL
      </mat-button-toggle>
      <mat-button-toggle value="en" [attr.aria-label]="'LANGUAGE.EN' | translate">
        EN
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</header>

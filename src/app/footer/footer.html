<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__grid">
      <section aria-labelledby="footer-about">
        <h2 id="footer-about">{{ 'ABOUT_WEBSITE' | translate }}</h2>
        <p>{{ 'LONG_DESCRIPTION' | translate }}</p>
      </section>
      <section aria-labelledby="footer-contact">
        <h2 id="footer-contact">{{ 'CONTACT_ME' | translate }}</h2>
        <ul>
          <li>
            <a
              href="https://www.linkedin.com/in/kolodziejczyk-sz"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'LINK.LINKEDIN' | translate"
            >
              <mat-icon aria-hidden="true" fontIcon="group" />
              LinkedIn
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/niewiemniczego"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'LINK.INSTAGRAM' | translate"
            >
              <mat-icon aria-hidden="true" fontIcon="photo_camera" />
              Instagram
            </a>
          </li>
          <li>
            <a
              href="https://github.com/kolodziejczyks"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="'LINK.GITHUB' | translate"
            >
              <mat-icon aria-hidden="true" fontIcon="code" />
              GitHub
            </a>
          </li>
        </ul>
      </section>
    </div>
    <div class="site-footer__legal">
      <p>© {{ currentYear }} Szymon Kołodziejczyk IT Solutions.</p>
      <p>{{ 'APACHE_LICENSED' | translate }}</p>
    </div>
  </div>
</footer>
